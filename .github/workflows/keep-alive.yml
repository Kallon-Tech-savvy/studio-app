name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Runs every Monday and Thursday at 9:00 AM UTC (adjust as needed)
    - cron: '0 9 * * 1,4' 
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Send Ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
            async function ping() {
              const { data, error } = await supabase.from('_zippy_ping').select('*').limit(1);
              // Alternatively, if you don't have a specific ping table, query any existing table:
              // const { data, error } = await supabase.from('your_table_name').select('id').limit(1);
              if (error) {
                console.log('Ping query note:', error.message);
              } else {
                console.log('Supabase successfully pinged at:', new Date().toISOString());
              }
            }
            ping();
          "
